services:
  - type: web
    name: clearclause-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render defaulted to Python 3.14; pydantic-core has no wheel and Rust build fails on RO filesystem.
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
        # Set to: https://clearclause.vercel.app,http://localhost:5173,http://127.0.0.1:5173
