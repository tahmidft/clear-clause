name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: anon
      SUPABASE_SERVICE_ROLE_KEY: service
      GEMINI_API_KEY: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smoke-test API (health + CORS)
        working-directory: backend
        env:
          CLEARCLAUSE_API_URL: http://127.0.0.1:8765
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8765 &
          UV_PID=$!
          trap 'kill $UV_PID 2>/dev/null' EXIT
          for _ in $(seq 1 40); do
            if curl -sfS --max-time 2 http://127.0.0.1:8765/health >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          bash ../scripts/verify-local-api.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit (prod deps)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev || true
      - name: pip-audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit || true

