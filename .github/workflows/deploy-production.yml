name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "scripts/render-sync-deploy.sh"
      - "scripts/deploy-production.sh"

jobs:
  render:
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Wait for Render health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 60 https://clearclause-api.onrender.com/health; then
              echo
              exit 0
            fi
            echo "Attempt $i: health not ready, retrying…"
            sleep 10
          done
          echo "Render health did not recover — check dashboard logs." >&2
          exit 1

  vercel:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
