name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "scripts/render-sync-deploy.sh"
      - "scripts/deploy-production.sh"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not configured — skipping Render deploy."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
      - name: Wait for Render health
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "No deploy hook — skipping health wait."
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 60 https://clearclause-api.onrender.com/health; then
              echo
              exit 0
            fi
            echo "Attempt $i: health not ready, retrying…"
            sleep 10
          done
          echo "Render health did not recover — check dashboard logs." >&2
          exit 1

  vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel secrets
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets not configured — skipping Vercel deploy."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.vercel.outputs.configured == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.vercel.outputs.configured == 'true'
      - run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        if: steps.vercel.outputs.configured == 'true'
      - run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        if: steps.vercel.outputs.configured == 'true'
      - run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        if: steps.vercel.outputs.configured == 'true'
