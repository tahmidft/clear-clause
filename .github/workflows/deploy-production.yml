name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "render.yaml"
      - "scripts/render-sync-deploy.sh"
      - "scripts/deploy-production.sh"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not configured — skipping Render deploy."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
      - name: Wait for Render health
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "No deploy hook — skipping health wait."
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 60 "${RENDER_HEALTH_URL:-https://clearclause-api-ma86.onrender.com/health}"; then
              echo
              exit 0
            fi
            echo "Attempt $i: health not ready, retrying…"
            sleep 10
          done
          echo "Render health did not recover — check dashboard logs." >&2
          exit 1

  vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel secrets
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets not configured — skipping Vercel deploy."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.vercel.outputs.configured == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.vercel.outputs.configured == 'true'
      # Remote build on Vercel — local/prebuilt deploys omit encrypted VITE_* and produce a blank app.
      - name: Deploy to Vercel (production)
        id: deploy
        if: steps.vercel.outputs.configured == 'true'
        run: |
          url="$(npx vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /dev/stderr | grep -oE 'https://clearclause-[a-z0-9]+-tahmidfts-projects\.vercel\.app' | tail -1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Alias clearclause.vercel.app
        if: steps.vercel.outputs.configured == 'true' && steps.deploy.outputs.url != ''
        run: |
          host="${{ steps.deploy.outputs.url }}"
          host="${host#https://}"
          npx vercel alias set "${host}" clearclause.vercel.app --token="${{ secrets.VERCEL_TOKEN }}"
