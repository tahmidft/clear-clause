# Ping Render /health on a schedule to reduce free-tier cold starts.
# Does not fix a suspended or crashed service — restore Render first (see .cursor/skills/render/SKILL.md).
name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: |
          set -euo pipefail
          url="https://clearclause-api.onrender.com/health"
          for attempt in $(seq 1 3); do
            if curl -fsS --max-time 120 "$url"; then
              echo
              exit 0
            fi
            echo "Attempt ${attempt}: no response (cold start or service down), retrying…" >&2
            sleep 15
          done
          echo "Keep-alive ping failed — check Render dashboard (status, logs, Manual Deploy)." >&2
          exit 1
